<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mood Table</title>

    <style>

        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #28a745;
            color: white;
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #e9ecef;
        }

        .emoji {
            font-size: 1.5rem;
        }

    </style>


</head>

<body>

    <h1>Mood Table</h1>

    <button id="toggleBtn">Show Table</button>

    <div id="board"></div>


    <script>

        const moods = [
            { emoji: "😁", text: "Feeling awesome!" },
            { emoji: "🤔", text: "Thinking deeply..." },
            { emoji: "😴", text: "Need more coffee." },
            { emoji: "🚀", text: "Ready to build something!" }
        ];

        const button = document.getElementById("toggleBtn");
        const board = document.getElementById("board");

        button.addEventListener("click", function() {

            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Emoji</th>
                            <th>Mood</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            moods.forEach(mood => {

                tableHTML += `
                    <tr>
                        <td class="emoji">${mood.emoji}</td>
                        <td>${mood.text}</td>
                    </tr>
                `;

                });

            tableHTML += `
                    </tbody>
                </table>
            `;

            board.innerHTML = tableHTML;

        });

    </script>

</body>
</html>
